apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: frontend-app-clusterrolebinding
subjects:
- kind: ServiceAccount
  name : developer-sa  #in local cluster k3d, user name is developer-sa
  namespace: default
roleRef: 
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: frontend-app-clusterrole


  #This ClusterRoleBinding grants the developer-sa ServiceAccount all the permissions defined in the developer ClusterRole across the whole cluster.