apiVersion: apps/v1
kind: Deployment  #creating deployment resource
metadata:
  name: frontend-app  #The name of the Deployment.
  namespace: team1
  labels: 
    app: frontend-app  #added for identification or grouping
spec:                 #deployment specification
  replicas: 3
  selector:            #how the Deployment finds its pods
    matchLabels: 
      app: frontend-app
  template:            # how each Pod looks
    metadata:
      labels: 
        app: frontend-app
    spec:               #pod specification  
      volumes: 
        - name: data-storage
          persistentVolumeClaim:
            claimName: frontend-app-pvc #This creates a volume called data-storage by attaching the PVC named frontend-app-pvc.
      containers:
      - name: frontend-app
        image: jayapriya054/frontend:latest
        ports: 
         - containerPort: 5000  #exposed port 5000 inside container
        volumeMounts:
         - mountPath: /var/lib/store
           name: data-storage



# Deployment runs the frontend
# Runs 3 replicas of your frontend app
# Uses Docker image: jayapriya054/frontend:latest or nginx:latest
# Mounts persistent storage from a PVC
# Exposes port 5000 inside the container
